# Um e-mail da lista entra direto no app, sem passar pela tela de sem acesso.
# Coberto por:
# - O link entra com o Bruno: TestSignInPage.test.tsx e o contrato do signInWithFakeGoogleService
#   (memberSignsIn).
# - Bruno vê o Início: _layout.test.tsx e o contrato do allowedEmailQueryService (emailInList).
appId: dev.leonardolf.livrocaixa
tags:
  - auth
---
- runScript: ../../scripts/resetData.js
- runFlow:
    file: ../../subflows/signInAs.yaml
    env:
      LINK: ${output.accounts.member.signInLink}
- assertVisible: Livro-Caixa
- assertNotVisible: Aguardando permissão
- takeScreenshot: home--member
