# O Bruno abre, no Início, a Luz que a Ana pagou: a folha mostra os detalhes sem Alterar nem Excluir, "Ver" abre o
# PDF de duas páginas no próprio app, a rolagem chega à segunda ("2 de 2") e o x volta para a folha.
# Coberto por:
# - Sem Alterar nem Excluir para quem não registrou, com o aviso "Só Ana…": EntryDetailsPage.test.tsx
#   ("Should offer neither to another member and say who can, for a payment") e as regras de entries
#   (entries.update.test.mjs e entries.delete.test.mjs).
# - O PDF abrir, rolar até a segunda página e o indicador "N de M": só no aparelho (a biblioteca de PDF é nativa e o
#   Jest não a roda); ReceiptViewerPage.test.tsx ("Should download the PDF checking the certificates") e
#   PdfPages.test.tsx cobrem só o que a página manda para ela.
# - O x volta para a folha: ReceiptViewerPage.test.tsx ("Should close with the x").
appId: dev.leonardolf.livrocaixa
tags:
  - entries
---
- runFlow:
    file: ../../steps/startAs.yaml
    env:
      PROFILE: admin
# O Bruno entra uma vez, para o nome dele chegar à lista de pessoas; a Ana, ao fim, para o dela.
- runFlow:
    file: ../../steps/signInAs.yaml
    env:
      LINK: ${output.accounts.member.signInLink}
- runScript:
    file: ../../data/request.js
    env:
      SCENARIO: seedEntryDetails
- stopApp
- launchApp
- scrollUntilVisible:
    element: "Luz"
- tapOn: "Luz"
- extendedWaitUntil:
    visible: "Só Ana pode alterar ou excluir este pagamento."
    timeout: 10000
- assertNotVisible: "Alterar"
- assertNotVisible: "Excluir"
- takeScreenshot: entry-details--other-member
- tapOn: "Comprovante: comprovante-luz.pdf. Ver"
- extendedWaitUntil:
    visible: "1 de 2"
    timeout: 30000
- scrollUntilVisible:
    element: "2 de 2"
    direction: DOWN
- takeScreenshot: receipt-viewer--pdf-second-page
- tapOn: Fechar
- assertVisible: "Só Ana pode alterar ou excluir este pagamento."
- assertNotVisible: "1 de 2"
- assertNotVisible: "2 de 2"
