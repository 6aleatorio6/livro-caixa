plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.receiptocr'
version = '0.1.0'

android {
  namespace "expo.modules.receiptocr"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // O modelo do texto latino vai embutido no APK: lê desde o primeiro comprovante, sem internet e sem download.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
